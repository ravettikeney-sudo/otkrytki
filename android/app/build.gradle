plugins { id 'com.android.application' }
android {
    namespace 'by.otkrytki.app'
    compileSdk 34
    defaultConfig {
        applicationId "by.otkrytki.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("HOME") + "/apk/atmosfera.keystore")
            storePassword "atmosfera-store"
            keyAlias "atmosfera"
            keyPassword "atmosfera-store"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    buildFeatures { buildConfig true }
    flavorDimensions "store"
    productFlavors {
        site { dimension "store"; buildConfigField "boolean", "SELF_UPDATE", "true" }
        rustore { dimension "store"; buildConfigField "boolean", "SELF_UPDATE", "false" }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
