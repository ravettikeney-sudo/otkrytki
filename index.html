<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Открытки с именем — бесплатно</title>
<meta name="description" content="Красивые открытки с именем за минуту: день рождения, Новый год, 8 Марта, доброе утро и другие праздники. Отправьте в WhatsApp, Telegram, VK. Бесплатно и без рекламы.">
<meta name="theme-color" content="#fff4ec">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Открытки">
<meta property="og:title" content="Вам открытка! 💌">
<meta property="og:description" content="Откройте, чтобы посмотреть. А ещё здесь можно сделать свою открытку с именем — бесплатно.">
<meta property="og:url" content="https://ravettikeney-sudo.github.io/otkrytki/">
<meta property="og:image" content="https://ravettikeney-sudo.github.io/otkrytki/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lobster&family=Marck+Script&family=Bad+Script&family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,400;1,400;1,700&family=Comfortaa:wght@500;700&family=Amatic+SC:wght@700&family=Kurale&display=swap">
<script src="cards.js"></script>
<style>
:root{
  --bg:#fff4ec; --bg2:#ffe9ef; --card:#ffffff; --ink:#2d1e2f; --muted:#7a6670; --line:rgba(80,40,60,.12);
  --rose:#e2557a; --rose2:#ff8a5c; --plum:#5b2a62; --soft:#fde3ea;
  --grad:linear-gradient(120deg,#ff5f8f,#ff8a5c 55%,#ffb347);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 100% -10%,#ffd9e4 0,transparent 60%),radial-gradient(700px 500px at -10% 30%,#fff0d6 0,transparent 60%),var(--bg);min-height:100vh;font-size:16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(255,244,236,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font:400 27px Lobster,cursive;color:var(--plum);text-decoration:none;flex:1;min-width:0}
.logo img{width:36px;height:36px;border-radius:10px}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.ibtn:active{transform:scale(.94)}
.hero{padding:26px 0 8px}
.hero h1{font:800 clamp(28px,6vw,44px)/1.1 Nunito;margin:0 0 6px;letter-spacing:-.02em}
.hero h1 em{font:400 1.08em Lobster,cursive;font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:17px}
.h2{font:800 14px Nunito;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 10px}
.soon{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.soon::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(120,50,70,.06);text-align:left}
.chip .e{font-size:24px}
.chip b{display:block;font-weight:800;font-size:15px;line-height:1.2}
.chip small{color:var(--rose);font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding-bottom:30px}
.hol{position:relative;border:0;padding:0;background:none;text-align:left;border-radius:20px;transition:transform .15s}
.hol:active{transform:scale(.97)}
.hol .th{aspect-ratio:1080/1350;border-radius:18px;overflow:hidden;background:var(--soft);box-shadow:0 8px 22px rgba(120,50,70,.14)}
.hol .th canvas,.hol .th img{width:100%;height:100%;display:block}
.hol b{display:block;margin:8px 4px 0;font-weight:800;font-size:15px;line-height:1.25}
.foot{padding:10px 0 40px;text-align:center;color:var(--muted);font-size:14px}
.foot a{color:var(--rose);font-weight:800}
.dlbar{display:flex;align-items:center;gap:12px;margin:6px 0 4px;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.dlbar div{flex:1;font-size:14px;color:var(--muted)}
.dlbar div b{display:block;color:var(--ink);font-size:15px}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:28px;padding:18px 0 120px;align-items:start}
.ed>*{min-width:0}
body{overflow-x:hidden}
.pv{position:sticky;top:78px}
.pv canvas{width:100%;max-width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 18px 40px rgba(90,30,60,.22);background:var(--soft)}
.field{margin-bottom:18px}
.field label,.lbl{display:block;font-weight:800;font-size:15px;margin:0 0 7px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;font-size:17px;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:var(--rose)}
.field textarea{min-height:120px;resize:vertical;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.pill:active{transform:scale(.96)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.dsg{flex:none;width:86px;border:0;padding:0;background:none;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.dsg canvas{width:86px;height:107px;border-radius:12px;display:block;margin-bottom:5px;outline:3px solid transparent;outline-offset:2px;box-shadow:0 4px 12px rgba(90,30,60,.15)}
.dsg[aria-pressed="true"] canvas{outline-color:var(--rose)}
.dsg[aria-pressed="true"]{color:var(--ink)}
.dots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--rose)}
.fonts{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.fnt{flex:none;min-width:84px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:26px;line-height:1.1}
.fnt[aria-pressed="true"]{border-color:var(--rose);background:#fff0f4}
.sendbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(255,244,236,0),rgba(255,244,236,.95) 30%)}
.sendbar .wrap{display:flex;justify-content:center}
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:17px 28px;border-radius:18px;border:0;color:#fff;font:900 18px Nunito;background:var(--grad);box-shadow:0 12px 28px rgba(255,95,143,.35);width:100%;max-width:520px}
.big:active{transform:scale(.98)}
.big.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}

/* share sheet */
.shx{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(40,15,35,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fi .2s}
@keyframes fi{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.shx-box{width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:26px;padding:18px 18px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
.shx-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shx-head h3{margin:0;font:900 21px Nunito}
.shx-prev{display:flex;justify-content:center;margin-bottom:14px}
.shx-prev img{max-height:34dvh;max-width:100%;border-radius:14px;box-shadow:0 10px 26px rgba(90,30,60,.25)}
.shx-main{display:flex;gap:8px;margin-bottom:16px}
.shx-main button{flex:1}
.shx-lbl{font:800 12px Nunito;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.soc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.soc a,.soc button{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;background:none;border:0;padding:0}
.soc i{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 17px Nunito;font-style:normal;background:var(--c);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.soc a:active i,.soc button:active i{transform:scale(.92)}
.note{margin:14px 0 0;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:760px){
  .shx{align-items:flex-end}
  .shx-box{width:100%;border-radius:26px 26px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));max-height:94dvh}
}

/* viewer */
.vw{position:fixed;inset:0;z-index:15;overflow:auto;background:radial-gradient(800px 600px at 50% 0,#ffd3e1,transparent 70%),linear-gradient(180deg,#fff0f4,#ffe8d6);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.vw h2{font:400 clamp(30px,7vw,44px) Lobster,cursive;color:var(--plum);margin:6px 0 14px;text-align:center}
.vw .from{margin:-8px 0 14px;font-weight:800;color:var(--rose);font-size:18px;position:relative}
.vw .cardwrap{position:relative;width:min(440px,100%);perspective:1200px}
.vw .cardwrap img{width:100%;display:block;border-radius:18px;box-shadow:0 24px 60px rgba(90,30,60,.3);animation:open 1s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes open{0%{transform:rotateX(70deg) translateY(60px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.vw canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.vw .acts{display:flex;flex-direction:column;gap:10px;width:min(440px,100%);margin-top:18px;position:relative}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:#2d1e2f;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;width:max-content;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:820px){
  .ed{grid-template-columns:1fr;gap:18px}
  .pv{position:static;max-width:400px;margin:0 auto;width:100%}
}
@media (min-width:821px){ .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="./" id="logo"><img src="icon-192.png" alt="">Открытки</a>
  <button class="ibtn" id="back" hidden aria-label="Назад"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ibtn" id="shareApp" aria-label="Поделиться приложением" title="Поделиться приложением"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e2557a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
</div></header>

<main class="wrap" id="home">
  <section class="hero"><h1>Открытка с именем <em>за минуту</em></h1><p>Выберите праздник, впишите имя — и отправьте в любой мессенджер.</p></section>
  <div class="h2" id="soonT">Скоро праздник</div>
  <div class="soon" id="soon"></div>
  <div class="h2">Все поводы</div>
  <div class="grid" id="grid"></div>
  <div class="dlbar" id="dlbar" hidden><div><b>Приложение для Android</b>Открытки всегда под рукой, работает быстрее</div><a class="pill" href="download/" style="text-decoration:none;color:var(--rose)">Скачать</a></div>
  <div class="foot">Бесплатно и без рекламы · <a href="#" id="tellFriends">Рассказать друзьям</a></div>
</main>

<main class="wrap" id="editor" hidden>
  <div class="ed">
    <div class="pv"><canvas id="pv" width="1080" height="1350" aria-label="Предпросмотр открытки"></canvas></div>
    <div>
      <div class="field"><label for="fName">Кому</label><input id="fName" placeholder="Имя, например: Ольга" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="fText">Поздравление</label><textarea id="fText" maxlength="600"></textarea>
        <div class="row"><button class="pill" id="nextText">↻ Другой текст</button><button class="pill" id="clearText">Без текста</button></div></div>
      <div class="field"><label for="fFrom">От кого</label><input id="fFrom" placeholder="Например: Твоя Маша" maxlength="60" autocomplete="off"></div>
      <div class="field"><span class="lbl">Оформление</span><div class="strip" id="designs"></div>
        <div class="dots" id="pals"></div></div>
      <div class="field"><span class="lbl">Шрифт</span><div class="fonts" id="fonts"></div>
        <div class="row"><button class="pill" id="shuffle">🎲 Перемешать украшения</button></div></div>
    </div>
  </div>
  <div class="sendbar"><div class="wrap"><button class="big" id="send"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>Отправить открытку</button></div></div>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const SITE = "https://ravettikeney-sudo.github.io/otkrytki/";
const inApp = !!window.OtkApp || /OtkrytkiApp/.test(navigator.userAgent);
const store = { get(k, d){ try{ const v = localStorage.getItem("otk:" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem("otk:" + k, JSON.stringify(v)); }catch(e){} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
const b64e = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const b64d = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(s); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))); };
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
if(!inApp) $("#dlbar").hidden = false;

/* ---------- home ---------- */
function thumb(c, w){ const cv = renderCard(c, w / W); return cv; }
function renderHome(){
  const soon = HOLIDAYS.map(h => ({ h, n: nextDate(h) })).filter(x => x.n).sort((a, b) => a.n.days - b.n.days).slice(0, 5);
  $("#soon").innerHTML = soon.map(({ h, n }) => `<button class="chip" data-h="${h.id}"><span class="e">${h.emoji}</span><span><b>${esc(h.name)}</b><small>${n.days === 0 ? "сегодня!" : n.days === 1 ? "завтра" : `${n.date.getDate()} ${MON[n.date.getMonth()]} · через ${n.days} ${plural(n.days, "день", "дня", "дней")}`}</small></span></button>`).join("");
  $("#grid").innerHTML = HOLIDAYS.map(h => `<button class="hol" data-h="${h.id}"><div class="th"></div><b>${h.emoji} ${esc(h.name)}</b></button>`).join("");
  document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => openEditor({ h: b.dataset.h }));
  const slots = [...document.querySelectorAll(".hol .th")];
  let i = 0; const step = () => { if(i >= slots.length) return; const h = HOLIDAYS[i]; slots[i].appendChild(thumb({ h: h.id, d: h.designs[0], p: 0, s: 11, n: "", t: "", f: "lobster" }, 300)); i++; setTimeout(step, 0); };
  step();
}

/* ---------- editor ---------- */
let card = null, wishIdx = 0, customText = false;
const FONT_KEYS = Object.keys(FONTS);
function openEditor(init){
  const h = HOL[init.h] || HOLIDAYS[0];
  card = Object.assign({ h: h.id, d: h.designs[0], p: 0, s: 1 + Math.floor(Math.random() * 1e6), n: "", t: h.wishes[0], f: "lobster", fr: store.get("from", "") }, init);
  wishIdx = Math.max(0, h.wishes.indexOf(card.t)); customText = false;
  $("#fName").value = card.n; $("#fText").value = card.t; $("#fFrom").value = card.fr;
  show("editor"); history.pushState({ v: "editor" }, "", location.pathname);
  document.title = h.name + " — открытка с именем";
  renderDesigns(); renderFonts(); renderPals(); draw(true);
  if(matchMedia("(min-width:821px)").matches) $("#fName").focus();
}
function renderDesigns(){
  const h = HOL[card.h];
  $("#designs").innerHTML = ""; h.designs.forEach(k => { const b = document.createElement("button"); b.className = "dsg"; b.setAttribute("aria-pressed", k === card.d); b.dataset.d = k;
    b.appendChild(renderCard({ h: card.h, d: k, p: 0, s: 5, n: "", t: "", f: card.f }, 172 / W)); b.append(DESIGNS[k].name);
    b.onclick = () => { card.d = k; card.p = 0; document.querySelectorAll(".dsg").forEach(x => x.setAttribute("aria-pressed", x === b)); renderPals(); draw(true); };
    $("#designs").appendChild(b); });
}
function renderPals(){
  const d = DESIGNS[card.d];
  $("#pals").innerHTML = d.pals.length < 2 ? "" : d.pals.map((p, i) => { const c = p.bg ? (Array.isArray(p.bg) ? p.bg : [p.bg, p.glow]) : p.sky; return `<button class="dot" aria-label="Цвет ${i + 1}" aria-pressed="${i === card.p}" data-p="${i}" style="background:linear-gradient(135deg,${c[0]},${c[c.length - 1]})"></button>`; }).join("");
  document.querySelectorAll(".dot").forEach(b => b.onclick = () => { card.p = +b.dataset.p; document.querySelectorAll(".dot").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(true); });
}
function renderFonts(){
  $("#fonts").innerHTML = FONT_KEYS.map(k => `<button class="fnt" data-f="${k}" aria-pressed="${k === card.f}" style="font:${FONTS[k].t.replace("{s}", 26)}" title="${FONTS[k].n}">Аа</button>`).join("");
  document.querySelectorAll(".fnt").forEach(b => b.onclick = () => { card.f = b.dataset.f; document.querySelectorAll(".fnt").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(true); });
}
let drawT = 0;
function draw(now){
  clearTimeout(drawT);
  const go = () => { const ctx = $("#pv").getContext("2d"); ctx.clearRect(0, 0, W, H); drawCard(ctx, card); };
  now ? go() : (drawT = setTimeout(go, 90));
}
$("#fName").oninput = e => { card.n = e.target.value; draw(); };
$("#fText").oninput = e => { card.t = e.target.value; customText = true; draw(); };
$("#fFrom").oninput = e => { card.fr = e.target.value; store.set("from", card.fr); draw(); };
$("#nextText").onclick = () => { const w = HOL[card.h].wishes; wishIdx = (wishIdx + 1) % w.length; card.t = w[wishIdx]; $("#fText").value = card.t; customText = false; draw(true); };
$("#clearText").onclick = () => { card.t = ""; $("#fText").value = ""; draw(true); };
$("#shuffle").onclick = () => { card.s = 1 + Math.floor(Math.random() * 1e6); draw(true); };

/* ---------- share ---------- */
const SOCIAL = [
  ["WhatsApp", "#25d366", `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.8z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.3-1.8-1-1 .8a4 4 0 0 1-2-2l.8-1-1-1.8z" fill="#fff" stroke="none"/></svg>`, (u, t) => `https://wa.me/?text=${t}%20${u}`],
  ["Telegram", "#29a9eb", `<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 4.3 2.9 11.5c-1 .4-1 1.6.1 1.9l4.7 1.5 1.8 5.6c.3.8 1.2 1 1.8.4l2.6-2.4 4.8 3.5c.7.5 1.6.1 1.8-.7l3.2-15.2c.2-1-.8-1.8-1.7-1.4zM9.6 14.4l8.2-7.2-6.6 8.3-.3 3-1.3-4.1z"/></svg>`, (u, t) => `https://t.me/share/url?url=${u}&text=${t}`],
  ["Viber", "#7360f2", `<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M8.6 3.5 6.4 3c-.7-.2-1.4.2-1.7.9l-1 2.6c-.2.6 0 1.2.3 1.7a19 19 0 0 0 10.9 10.9c.5.3 1.1.5 1.7.3l2.6-1c.7-.3 1.1-1 .9-1.7l-.5-2.2c-.2-.7-.8-1.1-1.5-1l-2.3.4a11 11 0 0 1-4.7-4.7l.4-2.3c.1-.7-.3-1.3-1-1.5z"/></svg>`, (u, t) => `viber://forward?text=${t}%20${u}`],
  ["VK", "#0077ff", "VK", (u, t) => `https://vk.com/share.php?url=${u}&title=${t}`],
  ["Одноклассники", "#ee8208", "ОК", (u, t) => `https://connect.ok.ru/offer?url=${u}&title=${t}`],
  ["Почта", "#6b5b7b", `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>`, (u, t) => `mailto:?subject=${t}&body=${t}%0A${u}`]
];
const nativeImg = () => !!(window.OtkApp && window.OtkApp.shareImage);
async function copyText(s){ try{ await navigator.clipboard.writeText(s); return true; }catch(e){} try{ const ta = document.createElement("textarea"); ta.value = s; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; } }
function closeShare(){ const b = $("#shx"); if(b){ const u = b.dataset.url; if(u) URL.revokeObjectURL(u); b.remove(); } }
function sheet({ title, img, link, text, file, b64, fileName, note }){
  closeShare();
  const U = encodeURIComponent(link), Tx = encodeURIComponent(text);
  const box = document.createElement("div"); box.className = "shx"; box.id = "shx";
  const canFiles = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
  const canSend = (b64 && nativeImg()) || canFiles || !!navigator.share;
  box.innerHTML = `<div class="shx-box" role="dialog" aria-modal="true" aria-labelledby="shxT">
    <div class="shx-head"><h3 id="shxT">${esc(title)}</h3><button class="ibtn" id="shxX" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    ${img ? `<div class="shx-prev"><img src="${img}" alt=""></div>` : ""}
    <div class="shx-main">${canSend ? `<button class="big" id="shxGo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>Отправить</button>` : ""}
      ${b64 ? `<button class="big ghost" id="shxSave"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Сохранить</button>` : ""}</div>
    <p class="shx-lbl">${canSend ? "Или ссылкой через" : "Отправить ссылкой через"}</p>
    <div class="soc">${SOCIAL.map(([n, c, ic, mk]) => `<a href="${esc(mk(U, Tx))}" target="_blank" rel="noopener"><i style="--c:${c}">${ic}</i>${n}</a>`).join("")}
      <button id="shxCopy"><i style="--c:#2f8f83"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></i>Копировать</button></div>
    ${note ? `<p class="note">${esc(note)}</p>` : ""}
  </div>`;
  if(img && img.startsWith("blob:")) box.dataset.url = img;
  document.body.appendChild(box);
  box.onclick = e => { if(e.target === box) closeShare(); };
  $("#shxX").onclick = closeShare;
  $("#shxCopy").onclick = async () => toast(await copyText(text + "\n" + link) ? "Скопировано — вставьте в любой чат" : "Не получилось скопировать");
  if($("#shxGo")) $("#shxGo").onclick = async () => {
    if(b64 && nativeImg()){ window.OtkApp.shareImage(b64, text + "\n" + link); return; }
    try{ if(canFiles) await navigator.share({ files: [file], text: text + "\n" + link }); else await navigator.share({ title, text, url: link }); }catch(e){ if(e.name !== "AbortError") toast("Не получилось отправить"); }
  };
  if($("#shxSave")) $("#shxSave").onclick = () => saveImage(b64, fileName, img);
}
function saveImage(b64, name, url){
  if(window.OtkApp && window.OtkApp.saveImage){ window.OtkApp.saveImage(b64, name); return; }
  const a = document.createElement("a"); a.href = url || "data:image/png;base64," + b64; a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Открытка сохранена");
}
const cardLink = c => SITE + "?k=" + b64e({ h: c.h, d: c.d, p: c.p, s: c.s, n: c.n.trim(), t: c.t.trim(), f: c.f, fr: c.fr.trim() });
const fileNameOf = c => "otkrytka-" + ((c.n || HOL[c.h].name).trim().replace(/[^\p{L}\p{N}]+/gu, "-") || "s-prazdnikom") + ".png";
async function shareCard(c){
  const cv = renderCard(c); const b64 = cv.toDataURL("image/png").split(",")[1];
  const blob = await new Promise(r => cv.toBlob(r, "image/png")); const fileName = fileNameOf(c);
  const file = new File([blob], fileName, { type: "image/png" });
  const text = `${c.n.trim() ? c.n.trim() + ", тебе" : "Тебе"} открытка 💌${c.fr.trim() ? " От: " + c.fr.trim() : ""}`;
  sheet({ title: "Отправить открытку", img: URL.createObjectURL(blob), link: cardLink(c), text, file, b64, fileName,
    note: "По ссылке открытка красиво раскроется у получателя, и он сможет сделать свою." });
}
function shareApp(){
  sheet({ title: "Рассказать о приложении", img: "og-image.jpg", link: SITE + "download/", text: "Нашла классное приложение: красивые открытки с именем за минуту, бесплатно и без рекламы 💌",
    note: "Друг получит ссылку на страницу, где можно скачать приложение." });
}
$("#send").onclick = () => shareCard(card);
$("#shareApp").onclick = shareApp;
$("#tellFriends").onclick = e => { e.preventDefault(); shareApp(); };

/* ---------- viewer (what the recipient sees) ---------- */
let fxRaf = 0;
function openViewer(c){
  const v = document.createElement("div"); v.className = "vw"; v.id = "viewer";
  const cv = renderCard(c);
  v.innerHTML = `<canvas class="fx"></canvas><h2>Вам открытка! 💌</h2>${c.fr ? `<p class="from">От: ${esc(c.fr)}</p>` : ""}
    <div class="cardwrap"><img alt="Открытка: ${esc(HOL[c.h]?.name || "")}" src="${cv.toDataURL("image/png")}"></div>
    <div class="acts">
      <button class="big" id="vReply">💌 ${c.fr ? "Ответить открыткой" : "Сделать свою открытку"}</button>
      <button class="big ghost" id="vSave">Сохранить открытку</button>
      <button class="big ghost" id="vHome">Все открытки</button>
    </div>`;
  document.body.appendChild(v);
  $("#vReply").onclick = () => { closeViewer(); openEditor({ h: c.h, n: c.fr ? c.fr.replace(/^(тво[йяё]|ваш[аи]?|от)\s+/i, "") : "" }); };
  $("#vSave").onclick = () => saveImage(cv.toDataURL("image/png").split(",")[1], fileNameOf(c));
  $("#vHome").onclick = () => { closeViewer(); show("home"); };
  particles(v.querySelector("canvas.fx"), c);
}
function closeViewer(){ cancelAnimationFrame(fxRaf); const v = $("#viewer"); if(v) v.remove(); history.replaceState(null, "", location.pathname); }
function particles(cv, c){
  const kind = ["winter", "baubles", "night"].includes(c.d) ? "snow" : ["hearts", "wedding", "roses"].includes(c.d) || ["feb14", "love"].includes(c.h) ? "heart" : ["tulips", "wreath", "meadow", "easter"].includes(c.d) ? "petal" : "confetti";
  const ctx = cv.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1); let w, h;
  const size = () => { w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr; }; size(); addEventListener("resize", size);
  const cols = kind === "heart" ? ["#ff4d6d", "#ff8fab", "#c9184a"] : kind === "petal" ? ["#ffafcc", "#ffc8dd", "#ffffff", "#ffd166"] : ["#ff5d8f", "#ffd166", "#4cc9f0", "#9b5de5", "#06d6a0"];
  const ps = Array.from({ length: kind === "snow" ? 90 : 60 }, () => ({ x: Math.random() * w, y: -Math.random() * h, v: (1 + Math.random() * 2) * dpr, s: (6 + Math.random() * 10) * dpr, a: Math.random() * TAU, va: (Math.random() - .5) * .1, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  const loop = t => {
    ctx.clearRect(0, 0, w, h); const fade = Math.min(1, Math.max(0, (14000 - (t - t0)) / 3000));
    ps.forEach(p => { p.y += p.v; p.x += Math.sin(p.a) * .8 * dpr; p.a += p.va; if(p.y > h + 20){ p.y = -20; p.x = Math.random() * w; }
      ctx.save(); ctx.globalAlpha = fade * (kind === "snow" ? .8 : .9); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      if(kind === "snow"){ ctx.fillStyle = "#ffffff"; ctx.shadowColor = "rgba(120,140,200,.6)"; ctx.shadowBlur = 6; ctx.beginPath(); ctx.arc(0, 0, p.s / 3, 0, TAU); ctx.fill(); }
      else if(kind === "heart"){ heartPath(ctx, 0, 0, p.s * 1.6); ctx.fillStyle = p.c; ctx.fill(); }
      else if(kind === "petal"){ ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s * .6, p.s * .3, 0, 0, TAU); ctx.fill(); }
      else { ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      ctx.restore(); });
    if(fade > 0) fxRaf = requestAnimationFrame(loop); else ctx.clearRect(0, 0, w, h);
  };
  fxRaf = requestAnimationFrame(loop);
}

/* ---------- navigation ---------- */
function show(view){
  $("#home").hidden = view !== "home"; $("#editor").hidden = view !== "editor";
  $("#back").hidden = view === "home"; scrollTo(0, 0);
  if(view === "home") document.title = "Открытки с именем — бесплатно";
}
$("#back").onclick = () => history.state && history.state.v === "editor" ? history.back() : show("home");
$("#logo").onclick = e => { e.preventDefault(); closeShare(); closeViewer(); show("home"); };
addEventListener("popstate", () => { closeShare(); if(!$("#editor").hidden) show("home"); });
/* Android back button (APK shell): close the topmost thing; return true if something was closed */
window.appBack = () => {
  if($("#shx")){ closeShare(); return true; }
  if($("#viewer")){ closeViewer(); show("home"); return true; }
  if(!$("#editor").hidden){ show("home"); return true; }
  return false;
};
addEventListener("keydown", e => { if(e.key === "Escape") window.appBack(); });

(async () => {
  await loadFonts();
  renderHome();
  const k = new URLSearchParams(location.search).get("k");
  if(k){ try{ const c = b64d(k); if(HOL[c.h]){ ["n", "t", "fr"].forEach(x => c[x] = String(c[x] || "").slice(0, 600)); openViewer(c); } }catch(e){} }
  const h = new URLSearchParams(location.search).get("h"); if(h && HOL[h]) openEditor({ h });
})();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
